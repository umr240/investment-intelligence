# git-cliff: CHANGELOG.md is generated from merged PR titles (squash merges make
# the PR title the commit), never written by hand (agentic-kit ADR 006: scripts,
# not agents). Generate or refresh it at release:
#   uvx git-cliff@2.14.2 -o CHANGELOG.md
# PR titles follow Conventional Commits (`feat(scope): ...`); CI checks them.

[changelog]
header = "# Changelog\n\nGenerated from merged PR titles by git-cliff; edit the PR title, not this file.\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore\\(deps", skip = true },
  { message = "^(chore|revert)", group = "<!-- 7 -->Other" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
