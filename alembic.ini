[alembic]
script_location = alembic
# os-native separator; without it alembic warns and splits on spaces/commas.
path_separator = os
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
version_path_separator = os
sqlalchemy.url = sqlite:///./investment_intelligence.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
