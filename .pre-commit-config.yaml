# Local copies of checks CI gates after the push. On a public repo a pushed
# branch is public at once, so a secret has to be stopped before the commit.
# Hooks are local: no hook repositories are fetched. ruff comes from uv.lock;
# gitleaks should match CI's pin (8.30.1, .github/workflows/ci.yml).
#
#   uv sync --dev --group hooks && uv run pre-commit install
#   brew install gitleaks
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: ruff-gated
        name: ruff F821,F811,E722 (the CI-gated subset)
        entry: uv run --no-sync ruff check --select F821,F811,E722 --force-exclude
        language: system
        types: [python]
      - id: public-text
        name: commit message is impersonal, no em or en dashes
        entry: python3 tools/check_public_text.py --message-file
        language: system
        stages: [commit-msg]
      - id: frontend-lint
        name: frontend lint (oxlint)
        entry: npm --prefix frontend run lint --if-present
        language: system
        files: ^frontend/
        pass_filenames: false
