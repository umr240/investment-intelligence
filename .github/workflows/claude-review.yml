name: Claude review

# `@claude` in a pull-request comment or review asks Claude Code to review the
# PR. Only people with write access can trigger it: the job condition checks
# the commenter's association, and the action re-checks write permission
# itself. CI tooling, not an application LLM call site (tests/test_llm_call_sites.py
# covers the Python code).
#
# Needs the repository secret CLAUDE_REVIEW_ANTHROPIC_API_KEY: a key used only
# for this workflow, from a Console workspace with its own spend limit.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Review only, enforced: the action runs on GITHUB_TOKEN (passed below), so
    # these permissions bind it. Without github_token it would swap in the
    # Claude GitHub App's token, which can write code.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      # Base ref at the workspace root, as the action's security guide advises;
      # the action then checks out the PR head itself to review it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6  # v1.0.259
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_REVIEW_ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}  # comments post as github-actions[bot]
          claude_args: |
            --max-turns 15
