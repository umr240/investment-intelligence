name: PR title

# Squash merges make the PR title the commit, and git-cliff builds CHANGELOG.md from
# those titles (cliff.toml), so titles follow Conventional Commits. Its own workflow so
# that editing a title re-runs the check (pull_request "edited"), without the rest of CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}  # passed by env, never interpolated into the script
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "PR title must follow Conventional Commits, e.g. 'feat(api): add export' (got: $TITLE)"
            exit 1
          fi
